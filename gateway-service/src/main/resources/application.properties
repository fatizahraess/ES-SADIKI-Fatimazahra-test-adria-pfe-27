
spring.application.name=gateway-service
server.port=8080

# Gateway sans Eureka
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Account Service - REST
spring.cloud.gateway.server.webflux.routes[0].id=account-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/accounts/**

# Transaction Service - REST
spring.cloud.gateway.server.webflux.routes[1].id=transaction-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/transactions/**

# Account Service - GraphQL
spring.cloud.gateway.server.webflux.routes[2].id=account-graphql
spring.cloud.gateway.server.webflux.routes[2].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/graphql/accounts
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/graphql

# Transaction Service - GraphQL
spring.cloud.gateway.server.webflux.routes[3].id=transaction-graphql
spring.cloud.gateway.server.webflux.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/graphql/transactions
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/graphql
