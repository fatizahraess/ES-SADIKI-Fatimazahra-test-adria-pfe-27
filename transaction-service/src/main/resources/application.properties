
spring.application.name=transaction-service
server.port=8082

# H2 Database
spring.datasource.url=jdbc:h2:mem:transactionsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# GraphQL
spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true

# MCP
spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.annotation-scanner.enabled=true

# OpenFeign - Account Service
account.service.url=http://localhost:8081

spring.cloud.openfeign.client.config.account-service.connectTimeout=3000
spring.cloud.openfeign.client.config.account-service.readTimeout=3000
