
spring.application.name=transaction-service
server.port=8082

# H2 Database
spring.datasource.url=jdbc:h2:mem:transactionsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# GraphQL
spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true

# MCP
spring.ai.mcp.server.name=transaction-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.annotation-scanner.enabled=true

# OpenFeign - Account Service
account.service.url=http://localhost:8081

spring.cloud.openfeign.client.config.account-service.connectTimeout=3000
spring.cloud.openfeign.client.config.account-service.readTimeout=3000

# Resilience4J Circuit Breaker
resilience4j.circuitbreaker.instances.accountService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.accountService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.health.circuitbreakers.enabled=true
management.endpoint.health.show-details=always
